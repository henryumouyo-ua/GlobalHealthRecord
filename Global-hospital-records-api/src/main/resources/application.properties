# --- Server ---
server.port=8080

# --- PostgreSQL Datasource ---
# Update the URL, username, and password for your local PostgreSQL instance.
# Unlike MySQL, PostgreSQL does NOT auto-create the database on connect —
# create it once yourself first, e.g.:
#   createdb hospital_appointments
# or from psql:
#   CREATE DATABASE hospital_appointments;
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_appointments
spring.datasource.username=postgres
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update will auto-create/update tables based on your entities.
# Switch to "validate" or "none" once your schema is stable in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Jackson (for LocalDateTime serialization) ---
spring.jackson.serialization.write-dates-as-timestamps=false
